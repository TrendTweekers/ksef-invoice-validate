name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC. npm exchanges this token for publish rights, so no
  # NPM_TOKEN secret exists to leak or rotate.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x; OIDC trusted publishing needs >= 11.5.1.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN on purpose. If one is set it takes precedence over
      # OIDC and defeats the point of trusted publishing.
      - name: Publish
        run: npm publish --access public --provenance
